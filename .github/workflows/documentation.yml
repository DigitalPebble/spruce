name: Deploy documentation to GH pages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the documentation from
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install zensical
      - name: Reject tags with versioned documentation
        run: "! grep -qFx '[project.extra.version]' docs/zensical.toml"
      - run: cd docs && zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - uses: actions/deploy-pages@v5
        id: deployment
