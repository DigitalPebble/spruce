# Regenerates the LLM inference coefficients (src/main/resources/ecologits/coefficients.csv)
# from the EcoLogits public API and opens a pull request when they changed.

name: Update EcoLogits coefficients

on:
  schedule:
    - cron: '0 6 5 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Regenerate the coefficients
        run: >
          mvn -B --no-transfer-progress compile exec:java
          -Dexec.mainClass=com.digitalpebble.spruce.modules.ecologits.EcoLogitsCoefficientsGenerator
          -Dexec.classpathScope=test

      - name: List the new models
        id: new-models
        env:
          CSV: src/main/resources/ecologits/coefficients.csv
        run: |
          # the generated_at header changes on every run, discard the file if nothing else did
          if git diff --quiet -I '^# generated_at=' -- "$CSV"; then
            git checkout -- "$CSV"
          fi
          # models that have coefficients now but did not before, they need a mapping.csv entry to be used
          {
            echo 'list<<EOF'
            comm -13 <(git show HEAD:"$CSV" | grep -v '^#' | cut -d, -f1,2 | sort) \
                     <(grep -v '^#' "$CSV" | cut -d, -f1,2 | sort) | sed 's/^/- /; s/,/\//'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          # a pull request opened with the default GITHUB_TOKEN does not trigger the CI
          # workflows, a token from the ECOLOGITS_DATA_TOKEN secret does
          token: ${{ secrets.ECOLOGITS_DATA_TOKEN || github.token }}
          branch: ecologits-data-update
          delete-branch: true
          add-paths: src/main/resources/ecologits/coefficients.csv
          commit-message: Update EcoLogits coefficients
          title: Update EcoLogits coefficients
          body: |
            Coefficients regenerated by `EcoLogitsCoefficientsGenerator` from the EcoLogits public API.

            Models added since the last refresh (they need an entry in `mapping.csv` to be used):

            ${{ steps.new-models.outputs.list || '- none' }}
